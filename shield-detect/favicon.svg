<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Shield shape -->
  <path d="M256 60 L400 130 L400 260 C400 340 340 410 256 452 C172 410 112 340 112 260 L112 130 Z" 
        fill="none" stroke="url(#shield)" stroke-width="12" filter="url(#shadow)"/>
  <path d="M256 100 L370 155 L370 260 C370 325 320 380 256 412 C192 380 142 325 142 260 L142 155 Z" 
        fill="url(#shield)" opacity="0.15"/>
  <!-- Check mark -->
  <path d="M190 260 L235 305 L320 200" fill="none" stroke="url(#glow)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal waves (small) -->
  <path d="M256 340 Q280 360 280 380 Q280 400 256 420" fill="none" stroke="url(#shield)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M256 355 Q270 367 270 380 Q270 393 256 405" fill="none" stroke="url(#shield)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
</svg>
